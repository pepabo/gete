name: tagpr

on:
  push:
    branches: [main]

jobs:
  tagpr:
    runs-on: ubuntu-latest

    permissions:
      contents: write # create tags and releases
      pull-requests: write # create and update the release pull request
      issues: read # changelog generation reads merged pull requests via the Issues API

    steps:
      - uses: actions/checkout@v5

      # On every push to main, create or update a pull request that collects
      # the unreleased changes. Merging that pull request creates the tag.
      - uses: Songmu/tagpr@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
