name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで新しい push があれば古い実行を止める
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 版はタグから導く。浅い checkout だとタグが無く、別の版で組まれる
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --frozen

      # pyproject.toml だけ変わって uv.lock が古いと、無関係な差分が
      # 後続の PR に混ざる
      - name: lock
        run: uv lock --check

      - name: lint
        run: uv run ruff check .

      - name: format
        run: uv run ruff format --check .

      - name: typecheck
        run: uv run mypy

      - name: test
        run: uv run pytest -q
