name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The version is derived from git tags. A shallow checkout has no
          # tags and would build under a different version.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --frozen --all-extras

      # Catches a pyproject.toml change whose uv.lock was not regenerated;
      # otherwise the lock diff shows up in an unrelated pull request later.
      - name: lock
        run: uv lock --check

      - name: lint
        run: uv run ruff check .

      - name: format
        run: uv run ruff format --check .

      - name: typecheck
        run: uv run mypy

      - name: test
        run: uv run pytest -q

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/agent_engine
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -diff -recursive

      # No backend and no credentials: this checks the module's syntax and
      # the provider schema, not a deployment.
      - name: validate
        run: terraform init -backend=false -input=false && terraform validate
