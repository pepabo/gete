name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing in this workflow writes to the repository or the API.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is derived from git tags. A shallow checkout has no
          # tags and would build under a different version.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --frozen --all-extras

      # Catches a pyproject.toml change whose uv.lock was not regenerated;
      # otherwise the lock diff shows up in an unrelated pull request later.
      - name: lock
        run: uv lock --check

      - name: lint
        run: uv run ruff check .

      - name: format
        run: uv run ruff format --check .

      - name: typecheck
        run: uv run mypy

      - name: test
        run: uv run pytest -q

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/agent_engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -diff -recursive

      # No backend and no credentials: this checks the module's syntax and
      # the provider schema, not a deployment.
      - name: validate
        run: terraform init -backend=false -input=false && terraform validate

  # The example project is run through the commands the way a user would,
  # against the module and the package in this checkout. The import check
  # installs the real deployment dependencies, so it takes a few minutes.
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - run: uv sync --frozen --all-extras

      - name: validate and import check
        working-directory: examples/minimal
        run: uv run gete validate --import-check

      - name: generated terraform is current
        working-directory: examples/minimal
        run: uv run gete terraform --out terraform --check

      # The generated file is committed, so it has to stay formatted like
      # the module. The terraform job only covers terraform/agent_engine.
      - name: generated terraform is formatted
        working-directory: examples/minimal/terraform
        run: terraform fmt -check -diff

      - name: terraform validate on the example
        working-directory: examples/minimal/terraform
        run: terraform init -backend=false -input=false && terraform validate
