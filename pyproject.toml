[project]
name = "gete"
description = "YAML の宣言から Agent Runtime（Vertex AI Agent Engine）へ載せ、Gemini Enterprise に登録する"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# 版はタグから導く。ここに静的な版を書くと、tagpr が書き換える版と
# uv.lock に記録される版が二重になる
dynamic = ["version"]
dependencies = [
    # ADK の minor が変わると Agent Card やツールの API が変わる。
    # 検証した範囲に留め、送り先の ADK もここに収める
    "google-adk>=2.6,<2.7",
    "httpx>=0.28",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# git の無いところ（sdist を展開しただけの環境）でも読み込めるようにする
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/gete"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
# 対象は src だけ。テストに機械的な型注釈を足す価値は薄い
files = ["src"]

# ADK と Google Cloud のライブラリは型情報を配布していないものがある
[[tool.mypy.overrides]]
module = ["google.adk.*", "google.auth.*", "vertexai.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
